function newSeed(){
 const products=productDefs.map((a,i)=>({id:'pr'+i,name:a[0],emoji:a[1],category:a[2],unit:a[3],packName:a[4],packQty:a[5],cost:a[6],retail:a[7],wholesale:a[8],lowStock:Math.ceil(a[9]*.16)}));
 const people=[{id:'c1',name:'حاجی احمد ـ کتاب‌فروشی',kind:'customer',phone:'۰۷۹۰ ۰۰۰ ۰۰۰',note:'مشتری عمده'},{id:'c2',name:'مکتب معرفت',kind:'customer',phone:'',note:'خرید ماهانه'},{id:'c3',name:'دکان قلم طلایی',kind:'customer',phone:'',note:''},{id:'s1',name:'شرکت وارداتی پامیر',kind:'supplier',phone:'',note:'تأمین‌کننده'},{id:'s2',name:'عمده‌فروشی کاغذ هرات',kind:'supplier',phone:'',note:''}];
 const batches=[];products.forEach((p,i)=>{const Q=productDefs[i][9];const q1=Math.floor(Q*.42);batches.push({id:id(),productId:p.id,qty:q1,cost:Math.round(p.cost*.94*100)/100,date:day(-22),origin:'موجودی آغازین'});batches.push({id:id(),productId:p.id,qty:Q-q1,cost:Math.round(p.cost*1.07*100)/100,date:day(-12),origin:'موجودی آغازین'});});
 const data={version:1,shopName:'عمده‌فروشی لوازم‌التحریر',openingCash:85000,method:'fifo',products,people,batches,transactions:[]};
 let k=1;const seedOrder=(kind,pid,items,totalPaid,date)=>{let lines=items.map(([p,q,unit,price])=>{const prod=products[p];const count=q*(unit==='pack'?prod.packQty:1);return {productId:prod.id,qty:count,quantity:q,unit,price,amount:Math.round(q*price*100)/100,name:prod.name}});const total=lines.reduce((s,l)=>s+l.amount,0);const tx={id:'seed'+k++,type:kind,personId:pid,date,total,paid:totalPaid,lines,note:'ثبت نمونه'};if(kind==='purchase'){for(const l of lines)data.batches.push({id:id(),productId:l.productId,qty:l.qty,cost:l.amount/l.qty,date,origin:tx.id})}else{let c=0;for(const l of lines){l.cogs=consume(data,l.productId,l.qty,data.method);c+=l.cogs}tx.cogs=c;tx.method=data.method;}data.transactions.push(tx)};
 seedOrder('purchase','s1',[[0,5,'pack',264],[2,3,'pack',425],[4,8,'pack',59]],1700,day(-5));
 seedOrder('purchase','s2',[[10,5,'base',180],[12,4,'pack',116]],300,day(-3));
 seedOrder('sale','c1',[[0,3,'pack',360],[2,2,'pack',600],[10,3,'base',255]],1800,day(-2));

 seedOrder('sale',null,[[0,3,'base',36],[7,2,'base',21],[9,1,'base',30]],180,day(0));
 data.transactions.push({id:'seed'+k++,type:'receipt',personId:'c1',amount:400,date:day(0),note:'قسمتی از حساب گذشته'});
 data.transactions.push({id:'seed'+k++,type:'payment',personId:'s1',amount:350,date:day(0),note:'قسمتی از حساب تأمین‌کننده'});

function consume(data,pid,qty,method){const layers=data.batches.filter(b=>b.productId===pid&&b.qty>1e-8);const total=layers.reduce((s,b)=>s+b.qty,0);if(qty>total+1e-7)throw new Error('موجودی این جنس کافی نیست.');let cost=0;
 if(method==='avg'){const unit=layers.reduce((s,b)=>s+b.qty*b.cost,0)/total;cost=qty*unit;const ratio=(total-qty)/total;for(const b of layers)b.qty*=ratio;if(qty>=total-1e-7)for(const b of layers)b.qty=0;}
 else{const ordered=method==='lifo'?[...layers].reverse():layers;let left=qty;for(const b of ordered){const take=Math.min(left,b.qty);b.qty-=take;cost+=take*b.cost;left-=take;if(left<1e-7)break}}return Math.round(cost*10000)/10000;

function summary(){let cash=db.openingCash,revenue=0,cogs=0,expenses=0,monthRevenue=0,monthCogs=0,monthExpenses=0;const month=day().slice(0,7);for(const t of db.transactions){const inMonth=t.date?.startsWith(month);if(t.type==='sale'){cash+=t.paid;revenue+=t.total;cogs+=t.cogs||0;if(inMonth){monthRevenue+=t.total;monthCogs+=t.cogs||0}}else if(t.type==='purchase'){cash-=t.paid}else if(t.type==='receipt'||t.type==='deposit'){cash+=t.amount}else if(t.type==='payment'||t.type==='withdraw'||t.type==='expense'){cash-=t.amount;if(t.type==='expense'){expenses+=t.amount;if(inMonth)monthExpenses+=t.amount}}}const balances=accountTotals();return {cash,revenue,cogs,expenses,monthRevenue,monthCogs,monthExpenses,gross:revenue-cogs,net:revenue-cogs-expenses,monthNet:monthRevenue-monthCogs-monthExpenses,inventory:db.batches.reduce((s,b)=>s+b.qty*b.cost,0),...balances};}
function personBalances(pid){let due=0,owed=0;for(const t of db.transactions){if(t.personId!==pid)continue;if(t.type==='sale')due+=t.total-t.paid;else if(t.type==='purchase')owed+=t.total-t.paid;else if(t.type==='receipt')due-=t.amount;else if(t.type==='payment')owed-=t.amount;}return {due:Math.max(0,Math.round(due*100)/100),owed:Math.max(0,Math.round(owed*100)/100)};}

 <div class="hero"><div><div class="eyebrow" style="color:#efcf8d">یک روز کاری آسان‌تر</div><h2>فروش کنید، بقیه حساب‌ها خودکار!</h2><p>برای عمده‌فروشی و فروش دانه‌ای لوازم‌التحریر؛ بدون فرم‌های پیچیده.</p><button data-page="sale" class="btn gold">${icon('plus')} فروش جدید</button></div><div class="hero-art" aria-hidden="true">📚✏️</div></div>
 <div class="metrics"><div class="metric"><div class="metriclabel">موجودی صندوق ${icon('home')}</div>${m(s.cash)}<div class="sub">پول نقد فعلی فروشگاه</div></div><div class="metric"><div class="metriclabel">فروش این ماه ${icon('sale')}</div>${m(s.monthRevenue)}<div class="sub">نقد و قرض هر دو</div></div><div class="metric"><div class="metriclabel">سود خالص این ماه ${icon('reports')}</div>${m(s.monthNet)}<div class="sub">فروش − بهای جنس − هزینه‌ها</div></div><div class="metric"><div class="metriclabel">ارزش موجودی انبار ${icon('inventory')}</div>${m(s.inventory)}<div class="sub">بر اساس لایه‌های خرید فعلی</div></div></div>
 <div class="sectiontitle"><h2>یک کار می‌خواهید انجام بدهید؟</h2><small>فقط روی گزینه بزنید</small></div>
 <div class="quickgrid"><button class="quick" data-page="sale"><div class="quickicon">${icon('sale')}</div><div><b>فروش</b><small>عمده یا دانه‌ای</small></div></button><button class="quick" data-page="purchase"><div class="quickicon">${icon('purchase')}</div><div><b>خرید</b><small>افزایش موجودی</small></div></button><button class="quick" data-action="receipt"><div class="quickicon">${icon('receive')}</div><div><b>پول گرفتم</b><small>دریافت از مشتری</small></div></button><button class="quick" data-action="payment"><div class="quickicon">${icon('pay')}</div><div><b>پول دادم</b><small>پرداخت به فروشنده</small></div></button><button class="quick" data-action="expense"><div class="quickicon">${icon('expense')}</div><div><b>هزینه</b><small>مصرف فروشگاه</small></div></button></div>
 <div class="twocol"><section class="panel"><div class="cardbar"><h3>آخرین فعالیت‌ها</h3><button class="tablebtn" data-page="reports">همه فعالیت‌ها</button></div><div style="padding:2px 18px">${activityRows(recents(5))}</div></section><section class="panel"><div class="cardbar"><h3>حساب‌های باز و وضعیت اجناس</h3><button class="tablebtn" data-page="people">دیدن اشخاص</button></div><div class="pad"><div class="rowline"><div>طلب شما از مشتریان<div class="rowsub">فروش‌هایی که هنوز کامل پرداخت نشده‌اند</div></div><b class="green">${fmt(s.due)} ؋</b></div><div class="rowline"><div>بدهی شما به تأمین‌کنندگان<div class="rowsub">خریدهای باقی‌مانده</div></div><b class="red">${fmt(s.owed)} ؋</b></div><div class="rowline"><div>اجناس کم‌موجود<div class="rowsub">پایین‌تر از حد هشدار هر جنس</div></div><b>${low.length} جنس</b></div><div class="subnote" style="margin-top:14px">💡 نمونه آماده است؛ یک فروش یا خرید آزمایشی ثبت کنید و ببینید صندوق، موجودی و سود چطور تغییر می‌کنند.</div></div></section></div>`}
function resetDraft(kind){ui.draft={party:'',lines:[],paid:0,paidTouched:false,note:'',kind};ui.tradeKind=kind;}
function ensureDraft(kind){if(ui.draft?.kind!==kind)resetDraft(kind)}
function unitText(p,u){return u==='pack'?`${p.packName} (${fmt(p.packQty)} ${p.unit})`:p.unit}
function lineValue(line){return Math.round(num(line.quantity)*num(line.price)*100)/100}
function tradeTotal(){return ui.draft.lines.reduce((a,l)=>a+lineValue(l),0)}
function tradeView(kind){ensureDraft(kind);const sale=kind==='sale',total=tradeTotal(),partyType=sale?'customer':'supplier';let people=db.people.filter(p=>p.kind===partyType||p.kind==='both');const defaultPay=ui.draft.paidTouched?ui.draft.paid:total;return `${heading(sale?'ثبت فروش':'ثبت خرید',sale?'فروش دانه‌ای و عمده‌ای؛ انتخاب جنس، تعداد و ثبت تمام.':'جنس را انتخاب کنید؛ قیمت خرید و موجودی خودکار به‌روز می‌شوند.',`<div class="actions"><button class="btn small" data-action="add-product">${icon('plus')} جنس جدید</button><button class="btn small" data-action="add-person">${icon('plus')} شخص جدید</button></div>`)}
 <div class="trade-layout"><section class="trade-left"><div class="panel"><div class="labelrow"><b>۱. انتخاب اجناس</b>${sale?`<div class="switch"><button class="${ui.mode==='retail'?'active':''}" data-action="mode" data-value="retail">پرچون</button><button class="${ui.mode==='wholesale'?'active':''}" data-action="mode" data-value="wholesale">عمده</button></div>`:`<span class="tag">اضافه شدن به انبار</span>`}</div><div class="filters"><div class="search">${icon('search')}<input id="catalogSearch" autocomplete="off" placeholder="جست‌وجوی جنس..." value="${esc(ui.catalogQuery)}"></div></div><div id="catalogChips">${categoryChips()}</div><div class="catalog" id="catalogList">${catalogCards(kind)}</div></div></section>
 <section class="trade-right"><div class="panel"><div class="cardbar"><h3>۲. ${sale?'فاکتور فروش':'فاکتور خرید'} <span class="tag">${ui.draft.lines.length} قلم</span></h3>${ui.draft.lines.length?'<button class="tablebtn red" data-action="clear-cart">پاک‌کردن فاکتور</button>':''}</div><div class="tradecart">${ui.draft.lines.length?ui.draft.lines.map((l,i)=>cartLine(l,i,kind)).join(''):`<div class="emptystate" style="padding:35px 8px"><div style="font-size:37px;margin-bottom:10px">🛒</div>از فهرست روبه‌رو روی جنس بزنید تا به فاکتور اضافه شود.</div>`}</div><div class="orderfoot"><div class="fieldset"><label>${sale?'مشتری':'فروشنده / تأمین‌کننده'}</label><select id="tradeParty"><option value="">${sale?'مشتری نقدی (بدون نام)':'خرید نقدی (بدون نام)'}</option>${people.map(p=>`<option value="${p.id}" ${ui.draft.party===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="fieldset"><label>مبلغ ${sale?'دریافتی':'پرداختی'} حالا (افغانی)</label><input type="number" inputmode="decimal" min="0" max="10000000000" step="0.01" id="tradePaid" value="${Math.round(defaultPay*100)/100}" ${!ui.draft.lines.length?'disabled':''}><span class="hint">برای فروش/خرید قرضی، صفر یا مبلغ کمتر وارد کنید. برای قرضی، نام ${sale?'مشتری':'فروشنده'} لازم است.</span></div><div class="fieldset"><label>یادداشت (اختیاری)</label><input id="tradeNote" value="${esc(ui.draft.note)}" placeholder="مثلاً حواله شماره ۱۲"></div><div class="rowline"><span>جمع فاکتور</span><b class="grand" id="grandTotal">${fmt(total)} ؋</b></div><div class="rowline"><span>باقی‌مانده ${sale?'مشتری':'فروشنده'}</span><b id="tradeDue" class="${total-defaultPay>0?'red':'green'}">${fmt(Math.max(0,total-defaultPay))} ؋</b></div>${sale?`<div class="rowline"><span>سود تقریبی این فروش</span><b class="green" id="tradeProfit">${fmt(estimateTradeProfit())} ؋</b></div>`:''}<button class="btn primary full" data-action="submit-trade" ${!ui.draft.lines.length?'disabled':''}>${icon('check')} ${sale?'ثبت فروش و صدور رسید':'ثبت خرید و افزودن به انبار'}</button></div></div><div class="demoalert">قیمت‌ها نمونه هستند و قابل تغییرند. تعداد و قیمت هر قلم را قبل از ثبت تغییر دهید.</div></section></div>`}
function categoryChips(){return `<div class="chips">${categories.map(c=>`<button class="chip ${ui.catalogCategory===c?'active':''}" data-action="category" data-value="${c}">${c}</button>`).join('')}</div>`}
function catalogCards(kind){let pList=db.products.filter(p=>(ui.catalogCategory==='همه'||p.category===ui.catalogCategory)&&normalize(p.name).includes(normalize(ui.catalogQuery)));return pList.length?pList.map(p=>{const available=stock(db,p.id),basePrice=kind==='sale'?(ui.mode==='retail'?p.retail:p.wholesale):avgCost(db,p.id);return `<button class="product" data-action="cart-add" data-id="${p.id}" ${kind==='sale'&&available<1?'disabled':''}><div class="prodicon">${p.emoji}</div><div style="min-width:0;flex:1"><div class="productname">${esc(p.name)}</div><div class="productdesc">انبار: ${fmt(available)} ${p.unit} ${available<=p.lowStock?' • کم‌موجود':''}</div><div class="productprice">${fmt(basePrice)} ؋ / ${p.unit}</div></div><span class="cornerplus">${icon('plus')}</span></button>`}).join(''):`<div class="emptystate">جنس پیدا نشد. می‌توانید جنس جدید اضافه کنید.</div>`}
function cartLine(l,i,kind){const p=product(l.productId);if(!p)return '';const left=stock(db,p.id),need=l.quantity*(l.unit==='pack'?p.packQty:1);return `<div class="tradecartitem"><div class="carttop"><div class="cartname"><div class="prodicon">${p.emoji}</div><div><b>${esc(p.name)}</b><div class="rowsub">${kind==='sale'?`انبار: ${fmt(left)} ${p.unit}`:`قیمت میانگین قبلی: ${fmt(avgCost(db,p.id))} ؋`}</div></div></div><button class="roundicon" data-action="cart-remove" data-index="${i}" aria-label="حذف جنس">${icon('x')}</button></div><div class="cartcontrols"><div><label>تعداد</label><input type="number" min="1" step="1" inputmode="numeric" data-cart-index="${i}" data-cart-field="quantity" value="${l.quantity}"></div><div><label>واحد</label><select data-cart-index="${i}" data-cart-field="unit"><option value="base" ${l.unit==='base'?'selected':''}>${p.unit}</option>${p.packQty>1?`<option value="pack" ${l.unit==='pack'?'selected':''}>${esc(p.packName)} (${p.packQty})</option>`:''}</select></div><div><label>قیمت هر واحد (؋)</label><input type="number" min="0" step="0.01" inputmode="decimal" data-cart-index="${i}" data-cart-field="price" value="${l.price}"></div></div><div class="carttotal">${fmt(lineValue(l))} ؋ ${kind==='sale'&&need>left+1e-7?'<span class="tag red">موجودی کافی نیست</span>':''}</div></div>`}
function estimateTradeProfit(){if(ui.draft?.kind!=='sale')return 0;let total=0;const copy=structuredClone(db);try{for(const l of ui.draft.lines)total+=lineValue(l)-consume(copy,l.productId,l.quantity*(l.unit==='pack'?product(l.productId).packQty:1),db.method)}catch{}return Math.round(total*100)/100}
function inventoryView(){const q=ui.stockQuery;const inv=db.products.reduce((a,p)=>a+stock(db,p.id),0);const low=db.products.filter(p=>stock(db,p.id)<=p.lowStock).length;return `${heading('اجناس و موجودی انبار','هر خرید موجودی را زیاد و هر فروش آن را کم می‌کند.',`<button class="btn primary" data-action="add-product">${icon('plus')} جنس جدید</button>`)}<div class="statlist"><div class="statbox"><small>نوع اجناس</small><b>${fmt(db.products.length)} محصول</b></div><div class="statbox"><small>مجموع واحدهای موجود</small><b>${fmt(inv)}</b></div><div class="statbox"><small>ارزش خرید موجودی</small><b>${fmt(summary().inventory)} ؋</b></div></div><div class="filters"><div class="search">${icon('search')}<input id="stockSearch" placeholder="نام جنس را جست‌وجو کنید" value="${esc(q)}"></div><span class="tag ${low?'gold':'green'}">${low} جنس کم‌موجود</span></div><div class="panel overflow"><table class="plain-table"><thead><tr><th>جنس</th><th>موجودی</th><th>قیمت پرچون</th><th>قیمت عمده / ${'دانه'}</th><th>ارزش موجودی</th><th>عملیات</th></tr></thead><tbody id="stockRows">${stockRows()}</tbody></table></div><div class="demoalert">موجودی همیشه بر اساس واحد پایه هر جنس حساب می‌شود؛ مثلاً ۲ بسته ۱۲تایی کتابچه = ۲۴ کتابچه.</div>`}
function stockRows(){const list=db.products.filter(p=>normalize(p.name).includes(normalize(ui.stockQuery)));return list.length?list.map(p=>{const qty=stock(db,p.id);return `<tr><td><div class="productline"><span class="prodicon">${p.emoji}</span><span><b>${esc(p.name)}</b><div class="rowsub">هر ${esc(p.packName)} = ${fmt(p.packQty)} ${esc(p.unit)}</div></span></div></td><td><b>${fmt(qty)} ${p.unit}</b><br><span class="tag ${qty<=p.lowStock?'red':'green'}">${qty<=p.lowStock?'کم‌موجود':'موجود'}</span></td><td>${fmt(p.retail)} ؋</td><td>${fmt(p.wholesale)} ؋</td><td>${fmt(stockValue(db,p.id))} ؋</td><td><button class="tablebtn" data-action="product-detail" data-id="${p.id}">جزئیات / ویرایش</button></td></tr>`}).join(''):`<tr><td colspan="6" class="emptystate">جنس پیدا نشد.</td></tr>`}
function peopleView(){if(!selectedPerson||!person(selectedPerson))selectedPerson=db.people[0]?.id;const p=person(selectedPerson),b=p?personBalances(p.id):{due:0,owed:0};return `${heading('حساب اشخاص','ببینید چه کسی بدهکار است و به چه کسی بدهکارید.',`<button class="btn primary" data-action="add-person">${icon('plus')} شخص جدید</button>`)}<div class="peoplegrid"><div class="panel"><div class="cardbar"><h3>مشتریان و فروشندگان</h3><span class="tag">${db.people.length} شخص</span></div><div class="pad" style="padding:9px">${db.people.map(p=>{const b=personBalances(p.id);return `<button class="personrow ${p.id===selectedPerson?'active':''}" data-action="select-person" data-id="${p.id}"><span class="avatar">${esc(p.name[0])}</span><span class="personinfo"><b>${esc(p.name)}</b><small>${p.kind==='supplier'?'تأمین‌کننده':p.kind==='customer'?'مشتری':'مشتری و تأمین‌کننده'}</small></span><span class="personmoney ${b.due?'red':b.owed?'red':'green'}">${b.due?`${fmt(b.due)} ؋ طلب`:b.owed?`${fmt(b.owed)} ؋ بدهی`:'تسویه'}</span></button>`}).join('')}</div></div><div class="panel">${!p?'<div class="emptystate">شخصی ثبت نشده است.</div>':`<div class="cardbar"><div><h3>${esc(p.name)}</h3><small class="muted">${esc(p.phone||'بدون شماره ثبت‌شده')}</small></div><span class="avatar">${esc(p.name[0])}</span></div><div class="pad"><div class="accountstat"><div><small>طلب شما از این شخص</small><strong class="green">${fmt(b.due)} ؋</strong></div><div><small>بدهی شما به این شخص</small><strong class="red">${fmt(b.owed)} ؋</strong></div></div><div class="actions"><button class="btn soft" data-action="receipt" data-person="${p.id}" ${b.due<=0?'disabled':''}>${icon('receive')} پول گرفتم</button><button class="btn" data-action="payment" data-person="${p.id}" ${b.owed<=0?'disabled':''}>${icon('pay')} پول دادم</button></div><div class="sectiontitle"><h2>گردش حساب</h2></div>${activityRows(recents(20,p.id))}</div>`}</div></div>`}
function reportsView(){const s=summary();const records=filteredTransactions();const top=db.products.map(p=>({p,count:db.transactions.filter(t=>t.type==='sale').flatMap(t=>t.lines||[]).filter(l=>l.productId===p.id).reduce((a,l)=>a+l.qty,0)})).sort((a,b)=>b.count-a.count).slice(0,5);return `${heading('گزارش‌های فروشگاه','فروش، سود، صندوق و فعالیت‌های ثبت‌شده با هم مرتبط‌اند.',`<button class="btn" data-action="export">${icon('download')} پشتیبان اطلاعات</button>`)}<div class="metrics"><div class="metric"><div class="metriclabel">کل فروش ${icon('sale')}</div>${m(s.revenue)}<div class="sub">شامل فروش‌های قرضی</div></div><div class="metric"><div class="metriclabel">سود ناخالص ${icon('reports')}</div>${m(s.gross)}<div class="sub">فروش منهای بهای اجناس فروخته‌شده</div></div><div class="metric"><div class="metriclabel">کل هزینه‌ها ${icon('expense')}</div>${m(s.expenses)}<div class="sub">مصارف عملیاتی ثبت‌شده</div></div><div class="metric"><div class="metriclabel">سود خالص ${icon('check')}</div>${m(s.net)}<div class="sub">سود ناخالص منهای هزینه‌ها</div></div></div><div class="twocol"><div class="panel"><div class="cardbar"><h3>خلاصه حساب</h3></div><div class="pad"><div class="rowline"><span>پول موجود در صندوق</span><b>${fmt(s.cash)} ؋</b></div><div class="rowline"><span>طلب از مشتریان</span><b>${fmt(s.due)} ؋</b></div><div class="rowline"><span>بدهی به تأمین‌کنندگان</span><b>${fmt(s.owed)} ؋</b></div><div class="rowline"><span>ارزش موجودی اجناس</span><b>${fmt(s.inventory)} ؋</b></div><div class="rowline"><span>روش فعلی بهای تمام‌شده</span><b>${methodName(db.method)}</b></div></div></div><div class="panel"><div class="cardbar"><h3>اجناس پرفروش</h3></div><div class="pad">${top.map(({p,count})=>`<div class="rowline"><span>${p.emoji} ${esc(p.name)}</span><b>${fmt(count)} ${esc(p.unit)}</b></div>`).join('')}</div></div></div><div class="sectiontitle"><h2>تمام فعالیت‌ها</h2></div><div class="filters"><div class="search">${icon('search')}<input id="historySearch" value="${esc(ui.historyQuery)}" placeholder="جست‌وجوی شخص، جنس یا توضیحات..."></div><select id="historyType" class="btn"><option value="all">همه عملیات</option>${[['sale','فروش'],['purchase','خرید'],['receipt','پول گرفتم'],['payment','پول دادم'],['expense','هزینه'],['deposit','ورود پول'],['withdraw','برداشت']].map(([id,name])=>`<option value="${id}" ${ui.historyType===id?'selected':''}>${name}</option>`).join('')}</select></div><div class="panel"><div id="historyList" class="pad" style="padding:4px 18px">${activityRows(records)}</div></div>`}
function filteredTransactions(){const q=normalize(ui.historyQuery);return [...db.transactions].filter(t=>(ui.historyType==='all'||t.type===ui.historyType)&&(normalize(txTitle(t)+' '+(person(t.personId)?.name||'')+' '+(t.note||'')+' '+(t.lines||[]).map(l=>l.name||product(l.productId)?.name).join(' ')).includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||db.transactions.indexOf(b)-db.transactions.indexOf(a));}
const methodName=x=>({fifo:'FIFO | اول‌وارد، اول‌خارج',lifo:'LIFO | آخر‌وارد، اول‌خارج',avg:'میانگین موزون'})[x]||x;
function settingsView(){const ex=product('pr0'),layers=db.batches.filter(b=>b.productId===ex.id&&b.qty>1e-7);return `${heading('تنظیمات','نام فروشگاه و روش حساب بهای جنس را خودتان انتخاب کنید.')}
 <div class="settingslayout"><div class="panel pad"><h2>مشخصات فروشگاه</h2><div class="fieldset" style="margin-top:13px"><label>نام فروشگاه</label><input id="shopName" value="${esc(db.shopName)}"></div><button class="btn primary" data-action="save-shop">ذخیره نام فروشگاه</button></div>
 <div class="sectiontitle"><h2>روش محاسبه بهای تمام‌شده</h2></div><div class="panel pad"><div class="subnote">وقتی از یک جنس در دو نوبت و با قیمت‌های متفاوت خرید می‌کنید، روش زیر مشخص می‌کند سود فروش‌های <b>بعدی</b> چطور محاسبه شود.</div><div class="settingsmethod">${[['fifo','FIFO','اول موجودی قدیمی مصرف شود'],['lifo','LIFO','اول موجودی جدید مصرف شود'],['avg','میانگین','میانگین موزون قیمت خرید']].map(([k,title,subtitle])=>`<button class="method ${db.method===k?'active':''}" data-action="method" data-value="${k}"><b>${title}</b><small>${subtitle}</small></button>`).join('')}</div><div class="subnote" style="margin-top:10px">تغییر روش، سود و رسید فروش‌های قبلاً ثبت‌شده را عوض نمی‌کند؛ فقط روی فروش‌های بعدی اثر دارد. خریدها به صورت لایه‌های قیمتی نگهداری می‌شوند.</div></div>
 <div class="sectiontitle"><h2>اطلاعات نمونه</h2></div><div class="panel pad"><p class="muted" style="font-size:12px;margin-bottom:13px">تمام اطلاعات در همین مرورگر ذخیره می‌شود و بدون انترنت هم کار می‌کند. با پاک‌شدن داده‌های مرورگر، اطلاعات پاک می‌شود.</p><div class="actions"><button class="btn" data-action="export">${icon('download')} دریافت فایل پشتیبان</button><button class="btn" data-action="import">ورود پشتیبان</button><button class="btn warn" data-action="reset">${icon('reset')} بازگشت به نمونه اول</button></div><input class="hide" type="file" id="importFile" accept="application/json,.json"></div><div class="demoalert">این نسخه یک پروتوتایپ تعاملی مستقل است، نه سیستم نهایی متصل به سرور. قیمت‌ها و نام‌های آزمایشی را با اطلاعات واقعی فروشگاه جایگزین کنید.</div></div>`}
function openModal(title,subtitle,content,size='',className=''){modaltag=className;$('#modals').className=className;$('#modals').innerHTML=`<div class="modaloverlay" id="overlay"><section class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${title}</h2><p>${subtitle||''}</p></div><button class="closebtn nonprint" data-action="close" aria-label="بستن">${icon('x')}</button></div><div class="modalbody">${content}</div></section></div>`;const first=$('#modals input:not([type="hidden"]),#modals select');if(first)setTimeout(()=>first.focus(),20);}
function closeModal(){modaltag='';$('#modals').className='';$('#modals').innerHTML=''}
function addToCart(pid){const p=product(pid),kind=ui.draft.kind;if(!p)return;const unit=kind==='sale'&&ui.mode==='retail'?'base':(p.packQty>1?'pack':'base');let existing=ui.draft.lines.find(x=>x.productId===pid&&x.unit===unit);if(existing){existing.quantity++}else{const unitPrice=kind==='purchase'?avgCost(db,pid)*(unit==='pack'?p.packQty:1):((ui.mode==='retail'?p.retail:p.wholesale)*(unit==='pack'?p.packQty:1));ui.draft.lines.push({id:id(),productId:pid,quantity:1,unit,price:Math.round(unitPrice*100)/100})}if(!ui.draft.paidTouched)ui.draft.paid=tradeTotal();render();if(window.innerWidth<670)$('#tradePaid')?.scrollIntoView({behavior:'smooth',block:'nearest'});}
function changeCart(index,field,value){const l=ui.draft?.lines?.[index];if(!l)return;const p=product(l.productId);if(field==='unit'){if(value!==l.unit){l.unit=value;l.price=Math.round((ui.draft.kind==='purchase'?avgCost(db,p.id):(ui.mode==='retail'?p.retail:p.wholesale))*(value==='pack'?p.packQty:1)*100)/100}}else if(field==='quantity'){const q=num(value);if(!Number.isInteger(q)||q<1||q>1e6){toast('تعداد باید عدد صحیح و مثبت باشد.',true);return}l.quantity=q}else if(field==='price'){const n=num(value);if(!validMoney(n)){toast('قیمت معتبر نیست.',true);return}l.price=n}if(!ui.draft.paidTouched)ui.draft.paid=tradeTotal();render();}
function submitTrade(){if(!ui.draft?.lines?.length){toast('ابتدا یک جنس به فاکتور اضافه کنید.',true);return}const kind=ui.draft.kind,paid=num(ui.draft.paidTouched?ui.draft.paid:tradeTotal()),total=tradeTotal(),personId=ui.draft.party||null;
 if(ui.draft.lines.some(l=>!product(l.productId)||!Number.isInteger(l.quantity)||l.quantity<1||!validMoney(l.price))){toast('تعداد یا قیمت یکی از اجناس معتبر نیست.',true);return}
 if(!validMoney(total)||total<=0||!validMoney(paid)||paid>total+0.001){toast('جمع فاکتور یا مبلغ نقدی معتبر نیست.',true);return}
 if(total-paid>0.001&&!personId){toast('برای فاکتور قرضی، نام مشتری یا فروشنده را انتخاب کنید.',true);return}
 if(personId&&!person(personId)){toast('شخص انتخاب‌شده پیدا نشد.',true);return}
 if(kind==='purchase'&&paid>summary().cash+1e-7){toast('پول صندوق برای پرداخت خرید کافی نیست. مبلغ نقدی را کمتر کنید.',true);return}
 const copy=structuredClone(db),trans={id:id(),type:kind,personId,date:day(),paid:Math.round(paid*100)/100,total:Math.round(total*100)/100,note:ui.draft.note.trim(),lines:[],method:kind==='sale'?db.method:undefined};let totalCost=0;
 try{for(const l of ui.draft.lines){const p=product(l.productId),qty=l.quantity*(l.unit==='pack'?p.packQty:1),amt=lineValue(l);if(!Number.isSafeInteger(qty)||qty<=0)throw new Error('تعداد معتبر نیست.');if(kind==='sale'&&stock(copy,p.id)+1e-7<qty)throw new Error(`موجودی «${p.name}» کافی نیست. اکنون ${fmt(stock(copy,p.id))} ${p.unit} موجود است.`);const row={productId:p.id,name:p.name,qty,quantity:l.quantity,unit:l.unit,unitLabel:unitText(p,l.unit),price:l.price,amount:amt};if(kind==='sale'){row.cogs=consume(copy,p.id,qty,db.method);totalCost+=row.cogs;}else{copy.batches.push({id:id(),productId:p.id,qty,cost:amt/qty,date:day(),origin:trans.id})}trans.lines.push(row)}
 }catch(e){toast(e.message,true);return}
 if(kind==='sale')trans.cogs=Math.round(totalCost*100)/100;copy.transactions.push(trans);db=copy;resetDraft(kind);persist();render();toast(kind==='sale'?'فروش ثبت شد؛ صندوق، سود و موجودی به‌روز شدند.':'خرید ثبت شد؛ موجودی و حساب فروشنده به‌روز شدند.');showTransaction(trans.id);
}
function cashModal(kind,preselected){const expense=kind==='expense';const validPeople=db.people.filter(p=>{const b=personBalances(p.id);return kind==='receipt'?b.due>0:b.owed>0});let initialPerson=validPeople.find(p=>p.id===preselected)?.id||validPeople[0]?.id||'';const mode=expense?'expense':validPeople.length?'settle':kind==='receipt'?'deposit':'withdraw';buildCashModal(kind,mode,initialPerson);}
function buildCashModal(kind,mode,personId){const expense=kind==='expense',receive=kind==='receipt';let validPeople=db.people.filter(p=>{const b=personBalances(p.id);return receive?b.due>0:b.owed>0});let pid=validPeople.find(p=>p.id===personId)?.id||validPeople[0]?.id||'',outstanding=pid?(receive?personBalances(pid).due:personBalances(pid).owed):0;const amount=mode==='settle'?outstanding:(expense?250:1000);
 openModal(expense?'ثبت هزینه':receive?'پول گرفتم':'پول دادم',expense?'مصرف فروشگاه را ثبت کنید.':receive?'پول وارد صندوق می‌شود.':'پول از صندوق خارج می‌شود.',`<form id="cashForm"><input type="hidden" name="kind" value="${kind}"><div class="fieldset"><label>بابت چه کاری؟</label><select name="mode" id="cashMode">${expense?'<option value="expense">هزینه فروشگاه</option>':`<option value="settle" ${mode==='settle'?'selected':''} ${!validPeople.length?'disabled':''}>${receive?'دریافت طلب از مشتری':'پرداخت بدهی به فروشنده'}</option><option value="${receive?'deposit':'withdraw'}" ${mode!=='settle'?'selected':''}>${receive?'افزودن سرمایه به صندوق':'برداشت شخصی از صندوق'}</option>`}</select></div><div id="cashPersonBox" class="fieldset ${mode!=='settle'?'hide':''}"><label>${receive?'از کدام مشتری؟':'به کدام فروشنده؟'}</label><select name="personId" id="cashPerson">${validPeople.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)} • ${fmt(receive?personBalances(p.id).due:personBalances(p.id).owed)} ؋</option>`).join('')}</select><div class="hint">باقی حساب این شخص: <b id="cashAvailable">${fmt(outstanding)} افغانی</b></div></div><div class="fieldset"><label>مبلغ (افغانی)</label><input type="number" min="0.01" step="0.01" name="amount" id="cashAmount" value="${Math.round(amount*100)/100}" required></div><div class="fieldset"><label>توضیح (اختیاری)</label><input name="note" placeholder="مثلاً دریافت بخشی از قرض"></div><div class="subnote">${expense?'این هزینه از صندوق کم و از سود خالص کسر می‌شود.':mode==='settle'?'این پول هم در صندوق و هم در حساب شخص ثبت می‌شود.':'این عملیات فقط پول صندوق را تغییر می‌دهد و فروش یا سود حساب نمی‌شود.'}</div><div class="modalbuttons"><button type="button" class="btn" data-action="close">انصراف</button><button class="btn primary" type="submit">${icon('check')} ثبت ${expense?'هزینه':receive?'دریافت':'پرداخت'}</button></div></form>`);
}
function submitCash(form){const f=new FormData(form),kind=f.get('kind'),mode=f.get('mode'),amount=num(f.get('amount')),personId=mode==='settle'?f.get('personId'):null;let type=kind==='expense'?'expense':mode==='settle'?kind:mode;if(!Number.isFinite(amount)||amount<=0||amount>1e10){toast('مبلغ معتبر وارد کنید.',true);return}
 if(mode==='settle'){const b=personBalances(personId||'');const max=kind==='receipt'?b.due:b.owed;if(!personId||max<=0||amount>max+.001){toast('مبلغ از باقی‌مانده حساب شخص بیشتر است.',true);return}}
 if(['payment','expense','withdraw'].includes(type)&&amount>summary().cash+1e-7){toast('پول صندوق برای این پرداخت کافی نیست.',true);return}
 const t={id:id(),type,personId,amount:Math.round(amount*100)/100,note:String(f.get('note')||'').trim(),date:day()};db.transactions.push(t);persist();closeModal();render();toast('عملیات ثبت شد و حساب‌ها به‌روز شدند.');showTransaction(t.id);
}
function personModal(){openModal('شخص جدید','مشتری یا فروشنده را اضافه کنید.',`<form id="personForm"><div class="fieldset"><label>نام مشتری یا فروشنده</label><input name="name" maxlength="100" required placeholder="مثلاً دکان کتاب احمد"></div><div class="fieldset"><label>نوع شخص</label><select name="kind"><option value="customer">مشتری</option><option value="supplier">فروشنده / تأمین‌کننده</option><option value="both">هر دو</option></select></div><div class="fieldset"><label>شماره تماس (اختیاری)</label><input name="phone" placeholder="07xxxxxxxx"></div><div class="fieldset"><label>یادداشت (اختیاری)</label><input name="note"></div><div class="modalbuttons"><button type="button" class="btn" data-action="close">انصراف</button><button type="submit" class="btn primary">ثبت شخص</button></div></form>`)}
function submitPerson(form){const f=new FormData(form),name=String(f.get('name')||'').trim(),kind=f.get('kind');if(name.length<2){toast('نام شخص را کامل وارد کنید.',true);return}if(!['customer','supplier','both'].includes(kind))return;const p={id:id(),name,kind,phone:String(f.get('phone')||'').trim(),note:String(f.get('note')||'').trim()};db.people.push(p);selectedPerson=p.id;if(ui.draft&&ui.draft.kind){const valid=ui.draft.kind==='sale'?'customer':'supplier';if(kind===valid||kind==='both')ui.draft.party=p.id;}persist();closeModal();render();toast('شخص جدید ثبت شد.');}
function productModal(pid){const p=pid?product(pid):null,edit=!!p;const d=p||{name:'',emoji:'📦',category:'لوازم مکتب',unit:'دانه',packName:'بسته',packQty:12,cost:0,retail:0,wholesale:0,lowStock:10};openModal(edit?'جزئیات و ویرایش جنس':'افزودن جنس جدید',edit?'قیمت‌ها و مشخصات جنس را تغییر دهید.':'واحد پایه و تعداد در هر بسته را تعیین کنید.',`<form id="productForm"><input type="hidden" name="productId" value="${edit?p.id:''}"><div class="flexfields"><div class="fieldset"><label>نام جنس</label><input required name="name" value="${esc(d.name)}"></div><div class="fieldset"><label>دسته</label><select name="category">${categories.filter(x=>x!=='همه').map(x=>`<option value="${x}" ${d.category===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="flexfields"><div class="fieldset"><label>واحد اصلی</label><input required name="unit" value="${esc(d.unit)}" placeholder="دانه، بسته..."></div><div class="fieldset"><label>واحد عمده / بسته</label><input required name="packName" value="${esc(d.packName)}"></div></div><div class="flexfields"><div class="fieldset"><label>چند واحد در یک بسته؟</label><input type="number" min="1" step="1" required name="packQty" value="${d.packQty}"></div><div class="fieldset"><label>هشدار موجودی کمتر از</label><input type="number" min="0" step="1" required name="lowStock" value="${d.lowStock}"></div></div><div class="flexfields"><div class="fieldset"><label>قیمت فروش دانه‌ای / واحد پایه (؋)</label><input type="number" min="0" step="0.01" required name="retail" value="${d.retail}"></div><div class="fieldset"><label>قیمت عمده برای هر واحد پایه (؋)</label><input type="number" min="0" step="0.01" required name="wholesale" value="${d.wholesale}"></div></div>${!edit?`<div class="flexfields"><div class="fieldset"><label>موجودی اولیه (${esc(d.unit)})</label><input type="number" min="0" step="1" name="initialQty" value="0"></div><div class="fieldset"><label>قیمت خرید هر واحد (؋)</label><input type="number" min="0" step="0.01" name="cost" value="0"></div></div>`:`<div class="subnote">موجودی فعلی: <b>${fmt(stock(db,p.id))} ${esc(p.unit)}</b> • قیمت میانگین موجودی: ${fmt(avgCost(db,p.id))} ؋ / ${esc(p.unit)} • تعداد بسته را برای فاکتورهای بعدی تغییر دهید.</div>`}<div class="modalbuttons"><button type="button" class="btn" data-action="close">انصراف</button><button type="submit" class="btn primary">${edit?'ذخیره تغییرات':'افزودن جنس'}</button></div></form>`, 'large');}
function submitProduct(form){const f=new FormData(form),p=product(f.get('productId')),name=String(f.get('name')||'').trim(),unit=String(f.get('unit')||'').trim(),packName=String(f.get('packName')||'').trim(),packQty=num(f.get('packQty')),lowStock=num(f.get('lowStock')),retail=num(f.get('retail')),wholesale=num(f.get('wholesale'));if(!name||!unit||!packName||!Number.isInteger(packQty)||packQty<1||packQty>1e6||!Number.isInteger(lowStock)||lowStock<0||![retail,wholesale].every(validMoney)){toast('مشخصات جنس را درست وارد کنید.',true);return}
 if(p){Object.assign(p,{name,unit,packName,packQty,lowStock,retail,wholesale,category:f.get('category')})}else{const qty=num(f.get('initialQty')),cost=num(f.get('cost'));if(!Number.isInteger(qty)||qty<0||!validMoney(cost)){toast('موجودی و قیمت خرید اولیه معتبر نیست.',true);return}const np={id:id(),name,emoji:'📦',unit,packName,packQty,lowStock,retail,wholesale,cost,category:f.get('category')};db.products.push(np);if(qty>0)db.batches.push({id:id(),productId:np.id,qty,cost,date:day(),origin:'موجودی آغازین'});if(ui.draft&&(page==='sale'||page==='purchase')){const kind=ui.draft.kind;ui.draft.lines.push({productId:np.id,quantity:1,unit:'base',price:Math.round((kind==='purchase'?cost:np.retail)*100)/100})}}
 persist();closeModal();render();toast(p?'اطلاعات جنس تغییر کرد.':'جنس جدید به فهرست اضافه شد.');}
function productDetail(pid){const p=product(pid);if(!p)return;const layers=db.batches.filter(b=>b.productId===pid&&b.qty>0.00001);openModal(`${p.emoji} ${esc(p.name)}`,'وضعیت موجودی و خریدهای مختلف',`<div class="statlist" style="grid-template-columns:repeat(2,1fr)"><div class="statbox"><small>موجودی</small><b>${fmt(stock(db,pid))} ${esc(p.unit)}</b></div><div class="statbox"><small>میانگین قیمت خرید</small><b>${fmt(avgCost(db,pid))} ؋</b></div></div><div class="sectiontitle"><h2>لایه‌های موجودی</h2></div>${layers.length?layers.map(b=>`<div class="rowline"><div><b>${fmt(b.qty)} ${esc(p.unit)}</b><div class="rowsub">${dateText(b.date)} • ${esc(b.origin==='موجودی آغازین'?'موجودی اولیه':'خرید جدید')}</div></div><b>${fmt(b.cost)} ؋ / ${esc(p.unit)}</b></div>`).join(''):'<div class="emptystate">موجودی تمام شده است.</div>'}<div class="modalbuttons"><button class="btn" data-action="close">بستن</button><button class="btn primary" data-action="edit-product" data-id="${p.id}">${icon('edit')} ویرایش جنس</button></div>`, 'large');}
function showTransaction(tid){const t=db.transactions.find(t=>t.id===tid);if(!t)return;const printIsGoods=t.type==='sale'||t.type==='purchase';const lineRows=printIsGoods?(t.lines||[]).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name||product(l.productId)?.name||'جنس')}</td><td>${fmt(l.quantity)} ${esc(l.unitLabel||'')}</td><td>${fmt(l.price)}</td><td><b>${fmt(l.amount)}</b></td></tr>`).join(''):`<tr><td>۱</td><td colspan="3">${esc(txTitle(t))} ${esc(t.note||'')}</td><td>${fmt(t.amount)}</td></tr>`;const due=printIsGoods?Math.round((t.total-t.paid)*100)/100:0;
 openModal(printIsGoods?t.type==='sale'?'رسید فروش':'رسید خرید':'رسید مالی','برای چاپ یا نمایش به مشتری',`<div class="invoice"><div class="invoicehead"><h2>${esc(db.shopName)}</h2><p>نمونه تعاملی ساخته‌شده توسط Devecomix • 0765220423</p><h3 style="margin-top:9px">${printIsGoods?t.type==='sale'?'فاکتور فروش':'فاکتور خرید':txTitle(t)}</h3></div><div class="labelrow"><small>شماره: ${esc(t.id.slice(0,8).toUpperCase())}</small><small>${dateText(t.date)}</small></div><div class="labelrow" style="margin:7px 0 12px"><small>${t.type==='purchase'?'فروشنده':'مشتری / شخص'}: ${esc(person(t.personId)?.name||'نقدی / عمومی')}</small>${t.method?`<small>${esc(methodName(t.method))}</small>`:''}</div><table><thead><tr><th>#</th><th>شرح</th><th>تعداد</th><th>فی واحد</th><th>مبلغ (؋)</th></tr></thead><tbody>${lineRows}</tbody></table><div class="rowline"><span>جمع</span><b>${fmt(printIsGoods?t.total:t.amount)} افغانی</b></div>${printIsGoods?`<div class="rowline"><span>پرداخت نقدی</span><b>${fmt(t.paid)} افغانی</b></div><div class="rowline"><span>باقی‌مانده</span><b>${fmt(due)} افغانی</b></div>`:''}${t.note?`<p class="muted" style="margin-top:10px;font-size:11px">یادداشت: ${esc(t.note)}</p>`:''}<div class="invoicefoot">Devecomix • نمونه آزمایشی، قیمت‌ها قابل تغییر هستند<br>☎ 0765220423</div></div><div class="modalbuttons nonprint"><button class="btn" data-action="close">بستن</button><button class="btn primary" data-action="print">${icon('print')} چاپ رسید A6</button></div>`, 'large','printarea');}
function showHelp(){openModal('راهنمای استفاده','چهار کار ساده برای آزمایش سیستم',`<div class="rowline"><div><b>۱. یک فروش ثبت کنید</b><div class="rowsub">از فهرست قلم یا کتابچه انتخاب کنید، قیمت و تعداد را تغییر دهید.</div></div>🛒</div><div class="rowline"><div><b>۲. خرید جدید ثبت کنید</b><div class="rowsub">جنس را به بکس یا دانه بخرید؛ موجودی انبار زیاد می‌شود.</div></div>📦</div><div class="rowline"><div><b>۳. حساب اشخاص را ببینید</b><div class="rowsub">با فروش قرضی، طلب شما ثبت می‌شود؛ «پول گرفتم» آن را کم می‌کند.</div></div>👥</div><div class="rowline"><div><b>۴. سود را آزمایش کنید</b><div class="rowsub">از تنظیمات FIFO، LIFO یا میانگین را انتخاب و یک فروش جدید ثبت کنید.</div></div>📈</div><div class="demoalert">همه اطلاعات نمونه است. این یک پیش‌نمایش تعاملی بدون سرور و بدون انترنت است؛ داده‌ها فقط در همین مرورگر باقی می‌مانند.</div><div class="modalbuttons"><button class="btn primary" data-action="close">فهمیدم</button><button class="btn" data-action="reset">شروع دوباره</button></div>`)}
function exportBackup(){const contents=JSON.stringify(db,null,2),blob=new Blob([contents],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Devecomix-stationery-demo-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('فایل پشتیبان آماده شد.');}
function importBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const parsed=JSON.parse(rd.result);if(parsed.version!==1||!Array.isArray(parsed.products)||!Array.isArray(parsed.people)||!Array.isArray(parsed.batches)||!Array.isArray(parsed.transactions)||!['fifo','lifo','avg'].includes(parsed.method))throw Error('قالب فایل معتبر نیست.');if(!confirm('اطلاعات فعلی با این فایل جایگزین شود؟'))return;db=parsed;resetDraft('');persist();render();toast('اطلاعات پشتیبان بازیابی شدند.')}catch(e){toast('فایل پشتیبان معتبر نیست: '+e.message,true)}};rd.readAsText(file)}
function resetDemo(){if(!confirm('تمام تغییرات و ثبت‌های شما پاک شود و نمونه اولیه برگردد؟'))return;db=newSeed();selectedPerson=db.people[0].id;ui.mode='wholesale';ui.catalogQuery='';ui.stockQuery='';ui.historyQuery='';ui.historyType='all';resetDraft('');closeModal();persist();render();toast('اطلاعات آزمایشی دوباره آماده شدند.');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-action]');if(!t){if(e.target.id==='overlay')closeModal();return}if(t.disabled)return;if(t.dataset.page){navigate(t.dataset.page);return}const action=t.dataset.action,pid=t.dataset.id;
 if(action==='close'){closeModal();return}if(action==='help'){showHelp();return}if(action==='category'){ui.catalogCategory=t.dataset.value;$('#catalogChips').innerHTML=categoryChips();$('#catalogList').innerHTML=catalogCards(page);return}if(action==='cart-add'){addToCart(pid);return}if(action==='cart-remove'){ui.draft.lines.splice(Number(t.dataset.index),1);if(!ui.draft.paidTouched)ui.draft.paid=tradeTotal();render();return}if(action==='clear-cart'){resetDraft(page);render();return}if(action==='mode'){ui.mode=t.dataset.value;render();return}if(action==='submit-trade'){submitTrade();return}
 if(['receipt','payment','expense'].includes(action)){cashModal(action,t.dataset.person);return}if(action==='add-person'){personModal();return}if(action==='select-person'){selectedPerson=pid;render();return}if(action==='add-product'){productModal();return}if(action==='edit-product'){productModal(pid);return}if(action==='product-detail'){productDetail(pid);return}if(action==='detail'){showTransaction(pid);return}if(action==='method'){db.method=t.dataset.value;saveAndRender(`روش محاسبه برای فروش‌های بعدی: ${methodName(db.method)}`);return}if(action==='save-shop'){const name=$('#shopName')?.value?.trim();if(!name){toast('نام فروشگاه را وارد کنید.',true);return}db.shopName=name;saveAndRender('نام فروشگاه ذخیره شد.');return}if(action==='reset'){resetDemo();return}if(action==='export'){exportBackup();return}if(action==='import'){$('#importFile')?.click();return}if(action==='print'){window.print();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='catalogSearch'){ui.catalogQuery=t.value;$('#catalogList').innerHTML=catalogCards(page);return}if(t.id==='stockSearch'){ui.stockQuery=t.value;$('#stockRows').innerHTML=stockRows();return}if(t.id==='historySearch'){ui.historyQuery=t.value;$('#historyList').innerHTML=activityRows(filteredTransactions());return}if(t.id==='tradePaid'){ui.draft.paidTouched=true;ui.draft.paid=num(t.value);const remain=tradeTotal()-ui.draft.paid;const due=$('#tradeDue');if(due){due.textContent=fmt(remain)+' ؋';due.className=remain>0?'red':'green'}return}if(t.id==='tradeNote'){ui.draft.note=t.value;return}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.cartIndex!==undefined){changeCart(Number(t.dataset.cartIndex),t.dataset.cartField,t.value);return}if(t.id==='tradeParty'){ui.draft.party=t.value;return}if(t.id==='historyType'){ui.historyType=t.value;$('#historyList').innerHTML=activityRows(filteredTransactions());return}if(t.id==='cashMode'){const f=t.closest('form');buildCashModal(f.querySelector('[name="kind"]').value,t.value,f.querySelector('#cashPerson')?.value||'');return}if(t.id==='cashPerson'){const f=t.closest('form'),kind=f.querySelector('[name="kind"]').value,b=personBalances(t.value);$('#cashAmount').value=kind==='receipt'?b.due:b.owed;$('#cashAvailable').textContent=fmt(kind==='receipt'?b.due:b.owed)+' افغانی';return}if(t.id==='importFile'){importBackup(t.files?.[0]);return}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='cashForm')submitCash(form);else if(form.id==='personForm')submitPerson(form);else if(form.id==='productForm')submitProduct(form)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modals').innerHTML)closeModal()});
$('#enterDemo').addEventListener('click',()=>{$('#splash').classList.add('hidden');render();});
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){try{const incoming=JSON.parse(e.newValue);if(incoming.version===1){db=incoming;resetDraft('');render();toast('داده‌ها از یک پنجره دیگر به‌روز شدند.')}}catch{}}});
render();persist();

</script></body></html>
