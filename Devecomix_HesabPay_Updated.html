function balanceBeforeEntry(t){
 const arr=entriesFor(t.personId).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||'')||String(a.id).localeCompare(String(b.id)));
 let b=0;for(const e of arr){if(e.id===t.id)break;b+=signed(e)}return b;
}
function allocation(before, type, amount){
 const change=isGiven(type)?amount:isTaken(type)?-amount:0;
 const opposite=(change>0&&before<0)||(change<0&&before>0);
 const cleared=opposite?Math.min(Math.abs(before),amount):0;
 const extra=opposite?Math.max(0,amount-cleared):0;
 return {cleared,extra,after:before+change};
}
function activityRow(t){
 const p=person(t.personId),info=typeInfo[t.type]||typeInfo.salary,fee=t.type==='salary'?` • خدمت ${fmt(t.rate||0)}٪`:'';
 let split='';if(t.type!=='salary'){
  const before=balanceBeforeEntry(t),a=allocation(before,t.type,t.amount);
  if(a.extra>0.000001)split=`<br><span style="color:#126549;font-weight:700">${fmt(a.cleared)} صاف شد؛ ${fmt(a.extra)} اضافه، خودکار در حساب ماند</span>`;
 }
 return `<button class="activity" data-entry="${esc(t.id)}"><div class="circle ${info.color}">${ico(info.icon)}</div><div class="txt"><b>${info.label} • ${esc(p?.name||'شخص حذف‌شده')}</b><small>${formatDate(t.date)}${fee}${t.note?' • '+esc(t.note):''}${split}</small></div><div class="amount"><b class="${isTaken(t.type)?'green':''}">${fmt(t.amount)} ؋</b><small>برای ویرایش بزنید</small></div></button>`;
}

 let sumTypes=fn=>t.filter(x=>fn(x.type)).reduce((a,x)=>a+x.amount,0);
 let fee=t.filter(x=>x.type==='salary').reduce((a,x)=>a+x.amount*(x.rate||0)/100,0),summary=totals();
 return `${pageTitle('گزارش ساده حساب‌ها','تمام مبالغ به زبان ساده.',`<button class="btn small" data-action="csv">${ico('download')} گزارش Excel/CSV</button>`)}<div class="toolbar"><div class="switcher">${[['today','امروز'],['month','این ماه'],['all','همه وقت']].map(([v,n])=>`<button class="seg ${reportPeriod===v?'active':''}" data-report-period="${v}">${n}</button>`).join('')}</div></div><div class="statgrid"><div class="mini-stat"><p>معاش توزیع‌شده</p>${money(s('salary'))}</div><div class="mini-stat"><p>فیصدی خدمت محاسبه‌شده</p>${money(fee)}</div><div class="mini-stat"><p>پول داده‌شده، غیر از معاش</p>${money(sumTypes(isGiven))}</div><div class="mini-stat"><p>پول گرفته‌شده، غیر از معاش</p>${money(sumTypes(isTaken))}</div></div><div class="sectiontitle"><h2>حساب فعلی همه اشخاص</h2><small>وضعیت فعلی، مستقل از محدوده زمانی بالا</small></div><div class="metrics" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div class="metric"><div class="metriclabel">مردم باید به من بدهند ${ico('up')}</div>${money(summary.receivable)}</div><div class="metric"><div class="metriclabel">من باید به مردم بدهم ${ico('down')}</div>${money(summary.payable)}</div></div><div class="sectiontitle"><h2>آخرین عملیات این دوره</h2><small>${fmt(t.length)} مورد</small></div><section class="panel">${ordered(t).slice(0,12).map(activityRow).join('')||empty('در این دوره چیزی ثبت نشده.')}</section><div class="infostrip">${ico('info')}<span>فیصدی خدمت فقط مبلغ <b>محاسبه‌شده</b> است؛ ثبت این مبلغ به معنای دریافت نقدی آن نیست.</span></div>${footer()}`
}

function settings(){return `${pageTitle('تنظیمات ساده','همان چند مورد ضروری برای دفتر حساب شما.') }<div class="stack"><section class="panel"><div class="listhead"><h3>مشخصات دفتر</h3></div><div class="settingrow"><div><b>نام دفتر / نمایندگی</b><p>در خانه برنامه نمایش داده می‌شود.</p></div><input class="input" id="businessName" value="${esc(data.settings.business)}" maxlength="65"></div><div class="settingrow"><div><b>فیصدی معمول خدمت</b><p>موقع پرداخت معاش خودکار پیشنهاد می‌شود؛ برای هر پرداخت قابل تغییر است.</p></div><div style="display:flex;align-items:center;gap:6px;flex:none"><input class="input" style="max-width:87px" type="number" id="defaultRate" min="0" max="100" step="0.01" value="${data.settings.rate}"><b>٪</b></div></div><div style="padding:14px 18px"><button class="btn primary" data-action="save-settings">${ico('check')} ذخیره تنظیمات</button></div></section><section class="panel"><div class="listhead"><h3>داده‌های آزمایشی</h3></div><div class="settingrow"><div><b>دریافت پشتیبان</b><p>حساب‌ها را به‌صورت فایل JSON نگه دارید.</p></div><button class="btn small" data-action="export">${ico('download')} دریافت</button></div><div class="settingrow"><div><b>بازگردانی پشتیبان</b><p>اطلاعات ذخیره‌شده قبلی را وارد کنید.</p></div><button class="btn small" data-action="import">${ico('upload')} انتخاب فایل</button></div><div class="settingrow"><div><b>شروع دوباره با اطلاعات نمونه</b><p>فقط داده‌های همین مرورگر پاک می‌شوند.</p></div><button class="btn danger small" data-action="reset">${ico('refresh')} بازنشانی</button></div></section><div class="infostrip">${ico('info')}<span>این نمونه بدون انترنت اجرا می‌شود و اطلاعات در مرورگر همان دستگاه ذخیره می‌شود. این نسخه برای نمایش و آزمایش است؛ برای استفاده واقعی به بکاپ منظم، امنیت، حسابرسی و راهکار نگهداری قابل اعتماد نیاز است.</span></div></div>${footer()}`}
function render(){renderShell();$('#app').innerHTML=({home,people:peopleView,person:personView,history,reports,settings}[view]||home)();}
function openModal(title,sub,html){$('#modals').innerHTML=`<div class="modaloverlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${title}</h2><p>${sub||''}</p></div><button class="iconbtn" data-action="close">${ico('x')}</button></div><div class="modalbody">${html}</div></section></div>`;setTimeout(()=>$('#modals input:not([type=hidden]),#modals select')?.focus(),60)}
function closeModal(){$('#modals').innerHTML='';draft=null;modalType=''}
const optPeople=(current='')=>`<option value="">شخص را انتخاب کنید…</option>${data.people.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${esc(p.name)}</option>`).join('')}`;
function openEntry(type='salary',pid='',eid=''){let old=data.entries.find(t=>t.id===eid);draft=old?{...old,type:cleanType(old.type)}:{id:'',type:cleanType(type),personId:pid,date:date(),amount:'',rate:data.settings.rate,note:''};modalType='entry';showEntryModal();}
function showEntryModal(){const edit=!!draft.id;openModal(edit?'ویرایش عملیات':'ثبت عملیات تازه','فقط نام شخص و مبلغ را بنویسید؛ بقیه حساب خودکار است.',`<div class="typegrid">${publicTypes.map(k=>`<button class="typetab ${k===draft.type?'active':''}" data-entry-type="${k}">${typeInfo[k].label}</button>`).join('')}</div><form id="entryForm"><div class="formgrid"><div class="field full"><label>نام شخص</label><select id="entryPerson" required>${optPeople(draft.personId)}</select><div style="text-align:left;margin-top:3px"><button type="button" class="linkbtn" data-action="new-person" data-from="entry">+ افزودن شخص تازه</button></div></div><div class="field"><label>مبلغ (افغانی)</label><input id="entryAmount" class="input" type="text" inputmode="decimal" placeholder="مثلاً ۵۰۰۰" value="${draft.amount||''}" required></div><div class="field"><label>تاریخ</label><input id="entryDate" class="input" type="date" value="${esc(draft.date)}" required></div>${draft.type==='salary'?`<div class="field full"><label>فیصدی خدمت / کمیشن</label><div style="display:flex;gap:9px;align-items:center"><input id="entryRate" class="input" type="number" min="0" max="100" step="0.01" value="${draft.rate??data.settings.rate}"><b>٪</b></div><p class="hint">فیصدی را خودتان تعیین می‌کنید؛ فقط روی همین پرداخت حساب می‌شود.</p></div>`:''}<div class="field full"><label>توضیح (اختیاری)</label><input id="entryNote" class="input" maxlength="160" placeholder="مثلاً معاش ماه جاری" value="${esc(draft.note||'')}"></div></div><div class="formnote ${draft.type==='advance'?'rose':''}" style="margin-top:15px">${ico('info')} <span>${typeInfo[draft.type].hint}</span></div><div id="entryPreview" style="padding:10px 4px 0"></div><div class="modalfoot"><button type="button" class="btn" data-action="close">انصراف</button><button type="submit" class="btn primary">${ico('check')} ${edit?'ذخیره تغییرات':'ثبت و ذخیره'}</button></div>${edit?`<div style="text-align:center;margin-top:9px"><button class="linkbtn red" type="button" data-action="delete-entry" data-id="${draft.id}">حذف این عملیات</button></div>`:''}</form>`);previewEntry()}
function readDraft(){if(!draft||modalType!=='entry')return;const val=k=>$('#'+k)?.value;draft.personId=val('entryPerson')||'';draft.amount=val('entryAmount')??draft.amount;draft.date=val('entryDate')||draft.date;draft.note=val('entryNote')||'';if(draft.type==='salary')draft.rate=val('entryRate')??draft.rate}
function previewEntry(){
 if(modalType!=='entry')return;
 const a=num($('#entryAmount')?.value),pid=$('#entryPerson')?.value;
 let b=pid?balance(pid):0;
 const editing=data.entries.find(t=>t.id===draft.id);
 if(editing&&editing.personId===pid)b-=signed(editing);
 const after=b+(draft.type==='salary'?0:isGiven(draft.type)?a:-a);
 let html=`<div class="summaryrow"><span>چه کاری ثبت می‌کنید؟</span><b>${typeInfo[draft.type].label}</b></div>`;
 if(draft.type==='salary'){
   const r=num($('#entryRate')?.value);
   html+=`<div class="summaryrow"><span>کمیشن حساب‌شده (${fmt(r)}٪)</span><b class="green">${fmt(a*r/100)} افغانی</b></div><div class="hint">این پرداخت، حساب قرض شخص را تغییر نمی‌دهد.</div>`;
 }else{
   const name=person(pid)?.name||'این شخص';
   html+=`<div class="summaryrow"><span>حساب قبل از این پرداخت</span><b>${moneyText(b)} • ${balanceLabel(b)}</b></div>`;
   const change=allocation(b,draft.type,a);
   if(a>0 && change.cleared>0){
     const who=isGiven(draft.type)?'از پولی که باید به او می‌دادم':'از پولی که او باید به من می‌داد';
     html+=`<div class="summaryrow"><span>${who}</span><b>${moneyText(change.cleared)} صاف می‌شود</b></div>`;
   }
   if(change.extra>0.000001){
      const leftover=isGiven(draft.type)?'او باید به من بدهد':'من باید به او بدهم';
      html+=`<div class="formnote" style="margin-top:10px;background:#eaf5ee;color:#145c3f;border:1px solid #cfe8d7"><span><b>✓ مبلغ اضافه خودکار حساب می‌شود.</b><br>${moneyText(change.extra)} اضافه می‌ماند؛ بعد از ثبت، ${leftover}.</span></div>`;
   }
   html+=`<div class="summaryrow" style="padding-top:12px"><span><b>حساب بعد از ثبت</b></span><b class="${after<0?'red':'green'}">${moneyText(after)} • ${balanceLabel(after)}</b></div>`;
 }
 $('#entryPreview').innerHTML=html;
}
function saveEntry(){readDraft();const a=num(draft.amount),r=num(draft.rate);if(!draft.personId||!person(draft.personId))return toast('نام شخص را انتخاب کنید.');if(!Number.isFinite(a)||a<=0||a>1e12)return toast('مبلغ معتبر و بیشتر از صفر وارد کنید.');if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.date)||Number.isNaN(new Date(draft.date).getTime()))return toast('تاریخ معتبر وارد کنید.');if(draft.type==='salary'&&(!Number.isFinite(r)||r<0||r>100))return toast('فیصدی بین صفر و صد باشد.');
// Exact cash amount is recorded, even if it crosses zero; the surplus stays in the person's balance.
const prev=data.entries.find(t=>t.id===draft.id);
const entry={id:draft.id||id(),type:cleanType(draft.type),personId:draft.personId,amount:a,date:draft.date,rate:draft.type==='salary'?r:0,note:draft.note?.trim()||'',createdAt:prev?.createdAt||new Date().toISOString()};if(prev)data.entries=data.entries.map(e=>e.id===prev.id?entry:e);else data.entries.push(entry);save();closeModal();render();toast(prev?'عملیات ویرایش شد.':'عملیات با موفقیت ثبت شد.');}
function openPersonForm(pid='',origin=''){if(origin==='entry' && modalType==='entry'){readDraft();pendingEntryDraft={...draft};}let p=person(pid);modalType='person';draft={origin,pid};openModal(p?'ویرایش شخص':'شخص تازه','برای هر نفر یک دفتر حساب جداگانه.',`<form id="personForm"><div class="formgrid"><div class="field full"><label>نام کامل</label><input class="input" id="personName" maxlength="80" value="${esc(p?.name||'')}" placeholder="مثلاً محمد احمد" required></div><div class="field full"><label>شماره تماس (اختیاری)</label><input class="input" id="personPhone" maxlength="50" type="tel" value="${esc(p?.phone||'')}" placeholder="07…"></div><div class="field full"><label>یادداشت (اختیاری)</label><textarea id="personNote">${esc(p?.note||'')}</textarea></div></div><div class="modalfoot"><button type="button" class="btn" data-action="close">انصراف</button><button type="submit" class="btn primary">${ico('check')} ذخیره شخص</button></div>${p?`<div style="text-align:center;margin-top:8px"><button type="button" class="linkbtn red" data-action="delete-person" data-id="${p.id}">حذف شخص</button></div>`:''}</form>`)}
function savePerson(){let name=$('#personName')?.value?.trim(),phone=$('#personPhone')?.value?.trim(),note=$('#personNote')?.value?.trim();if(!name)return toast('نام شخص را بنویسید.');let same=data.people.find(p=>norm(p.name)===norm(name)&&p.id!==draft.pid);if(same)return toast('این نام قبلاً ثبت شده است.');let pid=draft.pid||id();let old=person(pid);if(old)Object.assign(old,{name,phone,note});else data.people.push({id:pid,name,phone,note});let origin=draft.origin;save();closeModal();render();toast('شخص ذخیره شد.');if(origin==='entry'){const previous=pendingEntryDraft;pendingEntryDraft=null;openEntry(previous?.type||'salary',pid);if(previous){Object.assign(draft,{amount:previous.amount,date:previous.date,rate:previous.rate,note:previous.note});showEntryModal();}}}
function guide(){openModal('راهنمای خیلی کوتاه','سه کار ساده؛ باقی حساب خودکار است.',`<div class="stack"><div class="formnote"><b>۱. معاش دادم</b><br>مبلغ معاش و فیصدی را ثبت کنید؛ حساب قرض تغییر نمی‌کند.</div><div class="formnote"><b>۲. پول دادم</b><br>هر مقدار پولی که به شخص داده‌اید، حتی اگر بیشتر از قرض شما باشد، بنویسید. اضافهٔ پول خودکار می‌شود «او باید به من بدهد».</div><div class="formnote"><b>۳. پول گرفتم</b><br>هر پولی که شخص به شما داده ثبت کنید. اگر بیشتر از قرضش باشد، اضافهٔ آن خودکار می‌شود «من باید به او بدهم».</div><p class="muted" style="font-size:11px">این برنامه آزمایشی است؛ هیچ پول واقعی را انتقال نمی‌دهد. اطلاعات فقط در مرورگر همین دستگاه ذخیره می‌شود.</p></div><div class="modalfoot"><button class="btn primary full" data-action="close">فهمیدم</button></div>`)}
function confirmModal(title,body,action,label='بله، ادامه بده'){openModal(title,'تأیید عملیات',`<p style="font-size:12px;line-height:2">${body}</p><div class="modalfoot"><button class="btn" data-action="close">انصراف</button><button class="btn danger" data-action="${action}">${label}</button></div>`)}
function download(text,name,mime){const url=URL.createObjectURL(new Blob([text],{type:mime}));let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCSV(){const cells=[['تاریخ','شخص','نوع','مبلغ افغانی','فیصدی','کمیشن محاسبه‌شده','توضیح'],...ordered(data.entries).map(t=>[t.date,person(t.personId)?.name||'',typeInfo[t.type].label,t.amount,t.type==='salary'?t.rate:0,t.type==='salary'?+(t.amount*(t.rate||0)/100).toFixed(2):0,t.note||''])];const csv='\ufeff'+cells.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'hesabpay-report.csv','text/csv;charset=utf-8');toast('فایل گزارش دریافت شد.');}
function handleAction(action,el){switch(action){case'new-entry':openEntry(el.dataset.type||'salary',el.dataset.person||(view==='person'?selectedPerson:'')||'');break;case'new-person':openPersonForm('',el.dataset.from||'');break;case'edit-person':openPersonForm(el.dataset.id);break;case'close':closeModal();break;case'guide':guide();break;case'delete-entry':{const eid=el.dataset.id;confirmModal('حذف عملیات','این ثبت از دفتر حذف می‌شود و حساب شخص دوباره محاسبه می‌شود.','confirm-delete-entry','حذف کن');$('#modals .btn.danger').dataset.id=eid;break;}case'confirm-delete-entry':{data.entries=data.entries.filter(t=>t.id!==el.dataset.id);save();closeModal();render();toast('عملیات حذف شد.');break;}case'delete-person':{const pid=el.dataset.id;if(entriesFor(pid).length)return toast('این شخص سابقه حساب دارد؛ ابتدا سوابق را مدیریت کنید.');confirmModal('حذف شخص','این نام از دفتر اشخاص حذف می‌شود.','confirm-delete-person','حذف کن');$('#modals .btn.danger').dataset.id=pid;break;}case'confirm-delete-person':{data.people=data.people.filter(p=>p.id!==el.dataset.id);save();closeModal();if(view==='person')view='people';render();toast('شخص حذف شد.');break;}case'save-settings':{const name=$('#businessName').value.trim(),rate=num($('#defaultRate').value);if(!name||!Number.isFinite(rate)||rate<0||rate>100)return toast('نام دفتر و فیصدی معتبر وارد کنید.');data.settings.business=name;data.settings.rate=rate;save();render();toast('تنظیمات ذخیره شد.');break;}case'export':download(JSON.stringify({app:'devecomix-hesabpay-demo',version:1,...data},null,2),'hesabpay-backup.json','application/json;charset=utf-8');toast('پشتیبان دریافت شد.');break;case'import':$('#importFile').click();break;case'reset':confirmModal('شروع دوباره با داده‌های نمونه','تمام تغییرات همین مرورگر از بین می‌روند و نمونه‌های اولیه جایگزین می‌شوند. اگر حساب ثبت کرده‌اید، اول پشتیبان بگیرید.','confirm-reset','بازنشانی کن');break;case'confirm-reset':data=demoData();save();closeModal();nav('home');toast('اطلاعات آزمایشی بازنشانی شد.');break;case'csv':exportCSV();break;}}
document.addEventListener('click',e=>{const node=e.target.closest('[data-action],[data-page],[data-person],[data-entry],[data-entry-type],[data-report-period]');if(!node){if(e.target.classList.contains('modaloverlay'))closeModal();return}if(node.dataset.action){e.preventDefault();handleAction(node.dataset.action,node);return}if(node.dataset.page){nav(node.dataset.page);return}if(node.dataset.person){nav('person',node.dataset.person);return}if(node.dataset.entry){openEntry('salary','',node.dataset.entry);return}if(node.dataset.entryType){readDraft();draft.type=node.dataset.entryType;showEntryModal();return}if(node.dataset.reportPeriod){reportPeriod=node.dataset.reportPeriod;render();return}});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();saveEntry()}if(e.target.id==='personForm'){e.preventDefault();savePerson()}});
document.addEventListener('input',e=>{if(e.target.id==='entryAmount'||e.target.id==='entryRate'||e.target.id==='entryPerson')previewEntry();if(e.target.id==='searchPeople'||e.target.id==='searchHistory'){const idv=e.target.id,pos=e.target.selectionStart;keyword=e.target.value;const container=e.target.id==='searchPeople'?$('.panel'):$('.panel');if(idv==='searchPeople'){let ps=data.people.filter(p=>norm(p.name+' '+(p.phone||'')).includes(norm(keyword)));container.innerHTML=ps.length?ps.map(accountRow).join(''):empty('شخصی پیدا نشد.')}else{let ts=ordered(data.entries).filter(t=>(historyFilter==='all'||cleanType(t.type)===historyFilter)&&norm((person(t.personId)?.name||'')+' '+t.note+' '+typeInfo[t.type]?.label).includes(norm(keyword)));container.innerHTML=ts.length?ts.map(activityRow).join(''):empty('عملیاتی پیدا نشد.')}e.target.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='filterHistory'){historyFilter=e.target.value;let k=keyword;render();keyword=k;const input=$('#searchHistory');if(input)input.value=k;const list=$('.panel');let ts=ordered(data.entries).filter(t=>(historyFilter==='all'||cleanType(t.type)===historyFilter)&&norm((person(t.personId)?.name||'')+' '+t.note+' '+typeInfo[t.type]?.label).includes(norm(k)));list.innerHTML=ts.length?ts.map(activityRow).join(''):empty('عملیاتی پیدا نشد.')}if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;f.text().then(s=>{let x=JSON.parse(s);if(!Array.isArray(x.people)||!Array.isArray(x.entries)||!x.settings||x.people.some(p=>!p.id||!p.name)||x.entries.some(t=>!t.id||!typeInfo[t.type]||!x.people.some(p=>p.id===t.personId)||!Number.isFinite(t.amount)||t.amount<=0))throw Error('invalid');data={settings:{business:String(x.settings.business||'دفتر توزیع معاشات'),rate:Number(x.settings.rate)||0},people:x.people,entries:x.entries};save();nav('home');toast('پشتیبان بارگذاری شد.');}).catch(()=>toast('فایل پشتیبان معتبر نیست.')).finally(()=>e.target.value='')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modals').children.length)closeModal()});
$('#enterDemo').addEventListener('click',()=>{$('#splash').classList.add('hide');try{sessionStorage.setItem('devecomix_hesabpay_entered','1')}catch{}});
try{if(!sessionStorage.getItem('devecomix_hesabpay_entered'))$('#splash').classList.remove('hide')}catch{$('#splash').classList.remove('hide')}
render();
</script></body></html>
